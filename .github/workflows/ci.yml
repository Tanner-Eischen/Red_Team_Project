name: Offline evaluation contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev --extra harbor --extra geo
      - run: uv run --frozen --extra dev --extra harbor --extra geo ruff check .
      - run: uv run --frozen --extra dev --extra harbor --extra geo pytest
      - run: uv run --frozen --extra dev --extra harbor --extra geo redforge --help
      - run: uv run --frozen --extra dev --extra harbor --extra geo python scripts/check_public_tasks.py
