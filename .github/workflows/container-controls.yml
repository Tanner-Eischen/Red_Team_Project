name: Container control validation (no model calls)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev --extra harbor --extra geo
      - run: uv run --frozen --extra dev --extra harbor --extra geo redforge task generate --family scientific-etl --seed 123 --output-dir artifacts/tasks
      - run: uv run --frozen --extra dev --extra harbor --extra geo redforge task validate --task artifacts/tasks/scientific-etl-123-v1 --runtime docker --evidence-dir artifacts/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-evidence
          path: artifacts/validation
          retention-days: 14
