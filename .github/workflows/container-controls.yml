name: Container control validation (no model calls)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [scientific-etl, geospatial-raster, repository-debug]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev --extra harbor --extra geo
      - run: uv run --frozen --extra dev --extra harbor --extra geo python scripts/run_container_controls.py --family ${{ matrix.family }} --output-dir artifacts/container-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-evidence-${{ matrix.family }}
          path: artifacts/container-controls
          retention-days: 14
