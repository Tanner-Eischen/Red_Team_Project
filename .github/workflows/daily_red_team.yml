name: Daily Adversarial Red-Teaming Validation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  red_team_validation:
    name: Run Red-Teaming Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
      
      - name: Generate new adversarial tasks
        run: |
          python adversarial_task_generator.py \
            --weakness COBOL_PACKED_DECIMAL \
            --num-tasks 10 \
            --output-dir ./adversarial_tasks
      
      - name: Run red-teaming pipeline
        run: |
          python langgraph_red_team.py \
            --tasks adversarial_tasks/* \
            --weaknesses COBOL_PACKED_DECIMAL \
            --models gpt-4o claude-3.5-sonnet
      
      - name: Commit and push results
        if: always()
        run: |
          git config user.name "Red-Team Bot"
          git config user.email "bot@redteam.local"
          git add .context/ adversarial_tasks/ results/ || true
          git commit -m "chore: daily red-team validation" || true
          git push || true
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: validation-results-${{ github.run_number }}
          path: |
            results/
            .context/
          retention-days: 30
