name: Adversarial Pattern Validation

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday 2am
  workflow_dispatch:

jobs:
  validate_patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: https://api.portkey.ai/v1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt

      - name: Run LangGraph red-teaming pipeline (regression)
        run: |
          python langgraph_red_team.py --tasks cobol_packed_decimal-adversarial-001 --weaknesses COBOL_PACKED_DECIMAL --models gpt-4o claude-3.5-sonnet

      - name: Commit updated context/results
        if: always()
        run: |
          git config user.name "Red-Team Bot"
          git config user.email "bot@redteam.local"
          git add .context/ results/ || true
          git commit -m "chore: update adversarial patterns [automated]" || true
          git push || true
