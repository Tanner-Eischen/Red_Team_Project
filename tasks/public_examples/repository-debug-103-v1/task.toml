schema_version = "1.3"
artifacts = ["/app/pipeline.py", "/app/output"]

[agent]
timeout_sec = 600.0
user = "agent"
network_mode = "no-network"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
user = "root"
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
