[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harborforge"
version = "0.1.0"
description = "Reproducible adversarial discovery and independent terminal-agent evaluation"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
harbor = ["harbor==0.13.2"]
geo = ["rasterio==1.4.3", "numpy==2.2.6"]
legacy = ["langgraph==1.0.5", "python-dotenv==1.2.1", "requests==2.32.5"]
dev = ["pytest==8.4.2", "ruff==0.14.10"]

[project.scripts]
redforge = "harborforge.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["harborforge*", "harbor_renderer*"]
exclude = ["tests*", "docs*", "artifacts*", ".venv*"]

[tool.setuptools]
py-modules = ["harbor_runner", "failure_logging", "adversarial_task_generator"]

[tool.setuptools.package-data]
"harborforge.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
