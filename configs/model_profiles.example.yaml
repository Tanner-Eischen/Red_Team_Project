# Documentation only. Insert chosen profiles into a campaign's model_profiles.
# Placeholder identifiers are rejected. Prices must be user-verified, dated,
# and specific to the selected provider/model, including reasoning token costs.
model_profiles:
  - profile_id: REPLACE_WITH_PROFILE
    provider: REPLACE_WITH_PROVIDER
    model_id: REPLACE_WITH_LITELLM_MODEL_ID
    family: REPLACE_WITH_MODEL_FAMILY
    snapshot: null
    tier: 1
    repeats: 2
    supports_tools: true
    max_input_tokens: 320000
    max_output_tokens: 32000
    max_cost_usd_per_attempt: 10
    input_usd_per_million: 0
    output_usd_per_million: 0
    price_source: REPLACE_WITH_VERIFIED_PRICE_SOURCE
    price_checked_utc: REPLACE_WITH_UTC_DATE
    agent_kwargs: {}
